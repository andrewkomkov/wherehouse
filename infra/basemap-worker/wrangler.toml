name = "wherehouse-basemap"
main = "src/index.ts"
compatibility_date = "2024-09-02"
minify = true

# The basemap archives live in R2; the worker turns ranged reads into /{z}/{x}/{y}.mvt.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wherehouse-basemaps"
preview_bucket_name = "wherehouse-basemaps"

# Custom domain, not *.workers.dev — the Cache API is inert on workers.dev, so every
# tile would re-read R2. See docs/research/findings.md §6.
[[routes]]
pattern = "basemap.slim-shaggy.com"
custom_domain = true

[vars]
# The map is a public basemap; the browser fetches tiles directly.
ALLOWED_ORIGINS = "*"
CACHE_CONTROL = "public, max-age=86400"
